[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-profit"
version = "0.5.0"
description = "可转债打新卖出收益记录桌面软件"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
]
build = [
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
